<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abdullah Alom - Coin Reward</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <h1>🌟 Abdullah Alom 🌟</h1>

        <img
            src="abdullah.jpg"
            alt="Abdullah Alom"
            class="profile-photo"
        >

        <p>My Good Habits & Daily Activities</p>

    </header>


    <div class="coin-container">

        <div class="coin-box">

            🪙 Total Coins

            <div id="coins">0</div>

        </div>

    </div>


    <main class="container">

        <!-- GOOD ACTIVITIES -->

        <h2 class="good-heading">
            ✅ Good Activities (+5 Coins)
        </h2>

        <div id="goodTasks"></div>


        <!-- BAD ACTIVITIES -->

        <h2 class="bad-heading">
            ❌ Bad Activities (-2 Coins)
        </h2>

        <div id="badTasks"></div>


        <!-- ACTIVITY HISTORY -->

        <section class="history-box">

            <h2>📜 Activity History</h2>

            <div id="history"></div>

        </section>


        <button class="reset-button" id="resetButton">
            🔄 Reset All Coins
        </button>

    </main>


    <footer>

        <h3>🌟 Keep Doing Good Things! 🌟</h3>

        <p>Made for Abdullah Alom</p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
